<!doctype html>
<html lang="en">
    <head>
        <title>Weekly Class Routine</title>

        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            h1 {
                text-align: center;
                font-size: 50px;
                color: Tomato;
            }

            img {
                display: block;
                margin: 10px auto;
            }

            table, th, td {
                border: 1px solid black;
                border-collapse: collapse;
            }

            th, td {
                padding: 8px;
            }

            th {
                background-color: lightgreen;
            }

            h2 {
                color: blue;
            }

            fieldset {
                width: 500px;
            }
        </style>
    </head>

    <body>
        <h1>Weekly Class Routine</h1>

        <img
            src="https://placehold.co/200x60?text=Course+Logo"
            alt="Course Logo"
            width="200"
        >

        <table>
            <tr>
                <th colspan="4">Class Schedule - Fall 2026</th>
            </tr>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Course</th>
                <th>Room</th>
            </tr>
            <tr>
                <td rowspan="2">Sunday</td>
                <td>08:30 AM</td>
                <td>Web Technologies (Theory)</td>
                <td>D-101</td>
            </tr>
            <tr>
                <td>10:30 AM</td>
                <td>Web Technologies (Lab)</td>
                <td>Lab-3</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>09:30 AM</td>
                <td>Database Systems</td>
                <td>D-204</td>
            </tr>
            <tr>
                <td>Saturday</td>
                <td>11:30 AM</td>
                <td>Software Engineering</td>
                <td>D-507</td>
            </tr>
        </table>

        <h2>Class Feedback Form</h2>

        <form action="#" method="get">
            <fieldset>
                <legend>Class Feedback</legend>

                <label for="fname">Full Name:</label>
                <input type="text" id="fname" name="fname" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="date">Class Date:</label>
                <input type="date" id="date" name="date" required>
                <br><br>

                <label for="course">Course:</label>
                <input type="text" id="course" name="course" required>
                <br><br>

                <label for="rating">Rating (1 to 5):</label>
                <input type="number" id="rating" name="rating" min="1" max="5" required>
                <br><br>

                Class Type:
                <input type="radio" id="lab" name="class-type" value="Lab" required>
                <label for="lab">Lab</label>

                <input type="radio" id="theory" name="class-type" value="Theory">
                <label for="theory">Theory</label>
                <br><br>

                <label for="day">Day:</label>
                <select id="day" name="day" required>
                    <option value="">Select a day</option>
                    <option value="sunday">Sunday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="saturday">Saturday</option>
                </select>
                <br><br>

                <label for="comments">Comments:</label>
                <br>
                <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
                <br><br>

                <input type="submit" value="Send Feedback">
            </fieldset>
        </form>
    </body>
</html>
